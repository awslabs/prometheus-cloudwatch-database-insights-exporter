# Example configuration for Amazon CloudWatch Database Insights Exporter
# This file demonstrates tag-based instance filtering

discovery:
  regions:
    - us-west-2
  
  instances:
    max-instances: 25
    cache:
      ttl: "5m"
    
    # Include instances based on field patterns
    include:
      identifier:
        - "^prod-"
        - "^staging-"
      engine:
        - "postgres"
        - "mysql"
      
      # Tag-based filtering: Include instances with specific tags
      # All tag filters must match (AND logic)
      tag.Environment:
        - "^production$"
        - "^staging$"
      tag.Team:
        - "back"
        - "again"
    
    # Exclude instances based on field patterns
    exclude:
      identifier:
        - "test"
        - "temp"
      
      # Tag-based filtering: Exclude instances with specific tags
      # Any tag filter match will exclude (OR logic)
      tag.Status:
        - "deprecated"
        - "decommissioned"
      tag.Maintenance:
        - "true"
  
  metrics:
    statistic: "avg"    
    include:
      category:
        - "os"
        - "db"
      name:
        - "cpu"
        - "memory"
    
    exclude:
      name:
        - "test"

    # Break a metric down by one of its Performance Insights dimension groups.
    # Each rule matches metric names by regex; matching metrics are queried with a
    # GroupBy and exported as one series per dimension, under their own metric
    # name suffixed with the group (db.load.avg -> dbi_pg_db_load_avg_by_db_wait_event).
    #
    # Grouping adds no API requests: GroupBy travels inside the query it applies to.
    #
    # limit is required and caps how many dimensions are returned, which is what
    # decides exported cardinality. db.wait_event.type is a handful of series per
    # instance; db.sql_tokenized can be hundreds. It cannot exceed 25, the most a
    # single response can carry.
    #
    # Omit this section entirely to query every metric ungrouped (the default).
    dimensions:
      - pattern: "^db\\.load\\..*"
        group: "db.wait_event"
        keys:
          - "db.wait_event.type"
          - "db.wait_event.name"
        limit: 10

    cache:
      metric-metadata-ttl: "60m"    # How long to cache metric definitions per instance
      metric-data:
        max-size: 100000            # Maximum number of metric values to cache
        # Optional: Pattern-based TTL overrides for specific metrics
        # Patterns match against metric names: <metric-name-with-statistic>
        # Examples: "db.load.avg", "os.memory.total.avg"
        # If pattern TTL is smaller than the metric's data interval (dynamic TTL),
        # the dynamic TTL will be used instead to respect the actual metric granularity.
        # If no pattern matches, TTL is calculated dynamically from metric collection interval
        pattern-ttls:
          - pattern: "^db\\.load\\..*"        # Match db.load metrics (any statistic)
            ttl: "30s"
          - pattern: "^os\\.memory\\..*"      # Match os.memory metrics (any statistic)
            ttl: "5m"
  
  processing:
    concurrency: 4

export:
  port: 8081
  prometheus:
    metric-prefix: "dbi"
